<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickomium Print Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      padding: 24px;
      user-select: none;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-bar.ok { background: #dcfce7; color: #166534; }
    .status-bar.error { background: #fee2e2; color: #991b1b; }
    .status-bar.loading { background: #f3f4f6; color: #6b7280; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }
    .dot.gray { background: #9ca3af; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    select, input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: white;
      margin-bottom: 16px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: #1a1a1a;
      color: white;
    }
    .btn-primary:hover { background: #333; }
    .btn-secondary {
      background: white;
      color: #374151;
      border-color: #d1d5db;
    }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-test {
      background: white;
      color: #2563eb;
      border-color: #93c5fd;
    }
    .btn-test:hover { background: #eff6ff; }
    .msg {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .msg.success { display: block; background: #dcfce7; color: #166534; }
    .msg.error { display: block; background: #fee2e2; color: #991b1b; }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
    }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      font-weight: 500;
      color: #2563eb;
      cursor: pointer;
      flex: none;
    }
    .link-btn:disabled { color: #9ca3af; cursor: default; }
    .update-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 13px;
    }
    .update-banner[hidden] { display: none; }
    .update-banner span { flex: 1; }
    .update-banner button { flex: none; padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>🖨️ Tickomium Print Agent</h1>
  <p class="subtitle">Configura tu impresora térmica</p>

  <div id="updateBanner" class="update-banner" hidden>
    <span id="updateText"></span>
    <button class="btn-primary" id="updateBtn">Actualizar</button>
  </div>

  <div id="statusBar" class="status-bar loading">
    <span class="dot gray" id="statusDot"></span>
    <span id="statusText">Verificando conexión...</span>
  </div>

  <label for="printerSelect">Impresora</label>
  <select id="printerSelect">
    <option value="">Cargando impresoras...</option>
  </select>

  <div class="btn-row">
    <button class="btn-primary" id="saveBtn">Guardar</button>
    <button class="btn-test" id="testBtn">Imprimir Prueba</button>
  </div>

  <div id="msg" class="msg"></div>

  <p class="footer">
    <span id="versionText">Tickomium Print Agent</span> ·
    <button class="link-btn" id="checkUpdatesBtn">Buscar actualizaciones</button><br>
    Esta ventana se puede cerrar, la app sigue funcionando junto al reloj
  </p>

  <script>
    const api = window.electronAPI || window.api;
    const printerSelect = document.getElementById("printerSelect");
    const versionText = document.getElementById("versionText");
    const saveBtn = document.getElementById("saveBtn");
    const testBtn = document.getElementById("testBtn");
    const statusBar = document.getElementById("statusBar");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const msg = document.getElementById("msg");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = "msg " + type;
      setTimeout(() => { msg.className = "msg"; }, 4000);
    }

    async function loadConfig() {
      const config = await api.getConfig();
      if (config.version) versionText.textContent = `Tickomium Print Agent v${config.version}`;

      const printers = await api.getPrinters();
      printerSelect.innerHTML = '<option value="">-- Selecciona impresora --</option>';
      printers.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        if (p === config.printer) opt.selected = true;
        printerSelect.appendChild(opt);
      });

      if (printers.length === 0) {
        printerSelect.innerHTML = '<option value="">No se encontraron impresoras</option>';
      }

      checkHealth();
    }

    async function checkHealth() {
      try {
        const health = await api.getHealth();

        if (health.status !== "ok") {
          statusBar.className = "status-bar error";
          statusDot.className = "dot red";
          statusText.textContent = "Servidor no disponible";
          return;
        }

        if (!health.printer) {
          statusBar.className = "status-bar loading";
          statusDot.className = "dot gray";
          statusText.textContent = "Servidor activo — Selecciona una impresora";
          return;
        }

        if (health.printerStatus === "enabled") {
          statusBar.className = "status-bar ok";
          statusDot.className = "dot green";
          statusText.textContent = `Conectado — ${health.printer}`;
        } else if (health.printerStatus === "disabled") {
          statusBar.className = "status-bar error";
          statusDot.className = "dot red";
          statusText.textContent = `${health.printer} — Deshabilitada`;
        } else {
          statusBar.className = "status-bar error";
          statusDot.className = "dot red";
          statusText.textContent = `${health.printer} — No encontrada (¿desconectada?)`;
        }
      } catch {
        statusBar.className = "status-bar error";
        statusDot.className = "dot red";
        statusText.textContent = "Servidor no disponible";
      }
    }

    saveBtn.addEventListener("click", async () => {
      const printer = printerSelect.value;
      const result = await api.saveConfig({ printer });
      if (result.success) {
        showMsg("Configuración guardada", "success");
        checkHealth();
      } else {
        showMsg("Error al guardar", "error");
      }
    });

    testBtn.addEventListener("click", async () => {
      testBtn.textContent = "Imprimiendo...";
      testBtn.disabled = true;
      const result = await api.testPrint();
      testBtn.textContent = "Imprimir Prueba";
      testBtn.disabled = false;
      if (result.success) {
        showMsg("Prueba de impresión enviada", "success");
      } else {
        showMsg(result.message || "Error al imprimir", "error");
      }
    });

    // Actualizaciones: solo se instalan cuando el usuario presiona Actualizar.
    const updateBanner = document.getElementById("updateBanner");
    const updateText = document.getElementById("updateText");
    const updateBtn = document.getElementById("updateBtn");
    const checkUpdatesBtn = document.getElementById("checkUpdatesBtn");

    function renderUpdate(state) {
      checkUpdatesBtn.disabled = state.status !== "idle" && state.status !== "up_to_date";
      checkUpdatesBtn.textContent = state.status === "checking" ? "Buscando…" : "Buscar actualizaciones";
      if (state.status === "available") {
        updateText.textContent = `Hay una versión nueva (${state.update.version}).`;
        updateBtn.disabled = false;
        updateBtn.textContent = "Actualizar";
      } else if (state.status === "downloading") {
        updateText.textContent = `Descargando versión ${state.update.version}… ${state.progress}%`;
        updateBtn.disabled = true;
      } else if (state.status === "installing") {
        updateText.textContent = "Instalando. La app se cerrará y se volverá a abrir sola.";
        updateBtn.disabled = true;
      } else {
        updateBanner.hidden = true;
        return;
      }
      updateBanner.hidden = false;
    }

    updateBtn.addEventListener("click", () => api.startUpdate());
    checkUpdatesBtn.addEventListener("click", () => api.checkUpdates());
    api.onUpdateState(renderUpdate);
    api.getUpdateState().then(renderUpdate);

    loadConfig();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
